# Daily CI: quality gates on push/PR (complements the release build in release.yml)
# Audit decision (2026-09-01): windows = release artifact, must run; ubuntu = regression value only, optional; macos = no artifact, skipped.
# Job-level timeout backstop (the 360-minute default would burn fully); failure logs uploaded to diagnose Electron launch flakiness.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pickdone/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pickdone/package-lock.json') }}

      - name: Install
        working-directory: pickdone
        run: npm ci

      - name: Build packaging whitelist (from lock closure; prevents manual files drift)
        working-directory: pickdone
        run: |
          node scripts/build-whitelist.mjs
          git diff --exit-code package.json || (echo '::error::build.files drifted from the lock closure (hand-edited without build-whitelist)' && exit 1)

      - name: Check all gates (lint + fingerprint + licenses + tokens + i18n + tests + smoke)
        working-directory: pickdone
        run: npm run check:all
        # aligned with the local pre-commit hook: catches commits that bypassed hooks via --no-verify (token/fingerprint/i18n discipline)

      # Dependency audit: the npmmirror mirror used in local dev makes npm audit 404, so CI forces the official registry.
      # Non-blocking for now (continue-on-error): remove this line once legacy vulnerable deps are cleaned up, turning it into a hard release gate.
      - name: Dependency audit (production deps, advisory only for now)
        working-directory: pickdone
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
        continue-on-error: true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-all-logs-${{ matrix.os }}
          path: pickdone/tests/.artifacts/
          if-no-files-found: ignore
