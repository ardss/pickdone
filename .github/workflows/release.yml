# Release pipeline: v* tag push -> version consistency check -> full gates (check:all, same level as CI)
# -> electron-builder build -> live packaged verification (verify:packaged) -> upload to a GitHub **Draft** Release.
# Audit decision (2026-09-01): release gates must not be weaker than CI — previously only check ran, so bad code could bypass the full gates via a tag.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write # 创建 Release 与上传产物
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pickdone/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pickdone/package-lock.json') }}

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          V=$(node -p "require('./pickdone/package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json version v$V"; exit 1
          fi

      - name: Install
        working-directory: pickdone
        run: npm ci

      - name: Check all gates (must be >= CI level; a tag must not bypass gates)
        working-directory: pickdone
        run: npm run check:all

      - name: Clean dist (verify must never run against a stale or mixed build)
        working-directory: pickdone
        shell: bash
        run: rm -rf dist

      # 幂等防护(2026-09-07 实锤:v0.1.1 工作流重跑残留一份重复 draft 挂在页面)——
      # 打包前先删同 tag 的旧 draft,保证每个 tag 至多一份草稿
      - name: Delete stale draft for this tag (idempotent re-runs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q '.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | select(.draft) | .id' | head -1)
          if [ -n "$ID" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"; echo "stale draft $ID deleted"; fi

      - name: Build & publish (draft)
        working-directory: pickdone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish always

      - name: Verify packaged artifact (static asar/resources/skill/cmd)
        working-directory: pickdone
        run: node scripts/verify-packaged.cjs

      # Live boot: the exe-instant-exit P0 class (asar missing root package.json, 2026-09-03) is
      # invisible to static checks — prove the packaged app actually starts and logs readiness.
      - name: Live-boot packaged exe
        working-directory: pickdone
        shell: pwsh
        run: |
          $exe = (Get-Item 'dist\win-unpacked\*.exe')[0].FullName
          $env:TODO_USER_DATA_DIR = "$env:RUNNER_TEMP\boot-ud"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "packaged exe exited immediately (code $($p.ExitCode))"; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP 'boot-ud\logs\main.log'
          if (-not (Test-Path $log)) { Write-Error 'no main.log written — app never reached ready'; exit 1 }
          Write-Host "boot OK, log lines: $((Get-Content $log).Count)"
          Stop-Process -Id $p.Id -Force

      - name: Generate SHA256 checksums & attach to draft release
        working-directory: pickdone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist
          sha256sum *.exe latest.yml > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          # 空正文=发布页丑闻实锤(v0.1.2 曾整版无说明)——draft 正文必须非空。
          # 2026-09-08 修鸡生蛋:本 job 的"Delete stale draft"会重建空 draft,而 rerun 只重跑失败 job,
          # 所以"要求正文已填否则红"永远过不了;改为空时自动从仓库内 CHANGELOG 提取本版本段填充,
          # 再保留 >=30 字符红线(CHANGELOG 里也没写=红,防整版无说明)。
          BODY_LEN=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '[.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | select(.draft)][0].body // "" | length')
          echo "draft body length: $BODY_LEN"
          if [ "${BODY_LEN:-0}" -lt 30 ]; then
            VER="${GITHUB_REF_NAME#v}"
            node -e "
              const fs = require('fs');
              // 发布页双语(2026-09-08 用户定稿):中文段在前(CHANGELOG.zh.md)+ 分隔线 + 英文段(CHANGELOG.md);
              // 中文版缺失时降级纯英文并提示——单语发布不算红,但属于流程违规(见 CHANGELOG.zh.md 头部纪律)
              const extract = (file, ver) => {
                if (!fs.existsSync(file)) return null;
                const m = fs.readFileSync(file, 'utf8').match(new RegExp('## \\\\[' + ver + '\\\\][^\\\\n]*\\\\n([\\\\s\\\\S]*?)(?=\\\\n## \\\\['));
                return (m && m[1].trim()) ? m[1].trim() : null;
              };
              const en = extract('CHANGELOG.md', process.argv[1]);
              if (!en) { console.error('CHANGELOG has no section for ' + process.argv[1]); process.exit(1); }
              const zh = extract('../CHANGELOG.zh.md', process.argv[1]);
              const body = zh ? (zh + '\\n\\n---\\n\\n' + en) : en;
              console.log(zh ? 'bilingual notes: zh + en' : 'WARNING: no zh section in CHANGELOG.zh.md — publishing en only');
              fs.writeFileSync(process.env.RUNNER_TEMP + '/notes.md', body);
            " "$VER"
            gh release edit "$GITHUB_REF_NAME" --draft --notes-file "$RUNNER_TEMP/notes.md"
            BODY_LEN=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '[.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | select(.draft)][0].body // "" | length')
            echo "draft body auto-filled from CHANGELOG, length: $BODY_LEN"
          fi
          if [ "${BODY_LEN:-0}" -lt 30 ]; then
            echo "draft release body still empty/short after auto-fill — CHANGELOG section missing or too short"
            exit 1
          fi
