# Release pipeline: v* tag push -> version consistency check -> full gates (check:all, same level as CI)
# -> electron-builder build -> live packaged verification (verify:packaged) -> upload to a GitHub **Draft** Release.
# Audit decision (2026-09-01): release gates must not be weaker than CI — previously only check ran, so bad code could bypass the full gates via a tag.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write # 创建 Release 与上传产物
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pickdone/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pickdone/package-lock.json') }}

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          V=$(node -p "require('./pickdone/package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json version v$V"; exit 1
          fi

      - name: Install
        working-directory: pickdone
        run: npm ci

      - name: Check all gates (must be >= CI level; a tag must not bypass gates)
        working-directory: pickdone
        run: npm run check:all

      - name: Clean dist (verify must never run against a stale or mixed build)
        working-directory: pickdone
        shell: bash
        run: rm -rf dist

      # 幂等防护(2026-09-07 实锤:v0.1.1 工作流重跑残留一份重复 draft 挂在页面)——
      # 打包前先删同 tag 的全部旧 draft。2026-09-10:曾用 head -1 只删一份,重跑两次即漏;
      # 改为循环删除该 tag 的全部 draft,保证每个 tag 至多一份草稿
      - name: Delete stale drafts for this tag (idempotent re-runs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q '.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | select(.draft) | .id')
          if [ -n "$IDS" ]; then
            while read -r ID; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID" && echo "stale draft $ID deleted"
            done <<< "$IDS"
          fi

      # 与 ci.yml 同款(2026-09-10):tag 构建此前绕过了白名单漂移检查——release 门禁不得弱于 CI。
      # 照抄 ci.yml 的"Build packaging whitelist"步骤,保证 hand-edit package.json 的 build.files 漂移在打包前变红
      - name: Build packaging whitelist (from lock closure; prevents manual files drift)
        working-directory: pickdone
        run: |
          node scripts/build-whitelist.mjs
          git diff --exit-code package.json || (echo '::error::build.files drifted from the lock closure (hand-edited without build-whitelist)' && exit 1)

      - name: Build & publish (draft)
        working-directory: pickdone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish always

      - name: Verify packaged artifact (static asar/resources/skill/cmd)
        working-directory: pickdone
        run: node scripts/verify-packaged.cjs

      # Live boot: the exe-instant-exit P0 class (asar missing root package.json, 2026-09-03) is
      # invisible to static checks — prove the packaged app actually starts and logs readiness.
      - name: Live-boot packaged exe
        working-directory: pickdone
        shell: pwsh
        run: |
          $exe = (Get-Item 'dist\win-unpacked\*.exe')[0].FullName
          $env:TODO_USER_DATA_DIR = "$env:RUNNER_TEMP\boot-ud"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "packaged exe exited immediately (code $($p.ExitCode))"; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP 'boot-ud\logs\main.log'
          if (-not (Test-Path $log)) { Write-Error 'no main.log written — app never reached ready'; exit 1 }
          Write-Host "boot OK, log lines: $((Get-Content $log).Count)"
          Stop-Process -Id $p.Id -Force

      - name: Generate SHA256 checksums & attach to draft release
        working-directory: pickdone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist
          sha256sum *.exe latest.yml > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          # 空正文=发布页丑闻实锤(v0.1.2 曾整版无说明)——draft 正文必须非空。
          # 2026-09-08 修鸡生蛋:本 job 的"Delete stale draft"会重建空 draft,而 rerun 只重跑失败 job,
          # 所以"要求正文已填否则红"永远过不了;改为空时自动从仓库内 CHANGELOG 提取本版本段填充,
          # 再保留 >=30 字符红线(CHANGELOG 里也没写=红,防整版无说明)。
          BODY_LEN=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '[.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | select(.draft)][0].body // "" | length')
          echo "draft body length: $BODY_LEN"
          if [ "${BODY_LEN:-0}" -lt 30 ]; then
            # quoted heredoc → bash 零转义,JS 原样到达(v0.2.2 实锤:内联 node -e 双层转义把正则吃了闭括号,此步从未成功过,v0.2.1 的红同根因)
            VER="${GITHUB_REF_NAME#v}" WORKSPACE="$GITHUB_WORKSPACE" node <<'NODEEOF'
              const fs = require('fs');
              // 发布页双语:中文段在前(CHANGELOG.zh.md)+ 分隔线 + 英文段;缺中文降级单语并告警(见 CHANGELOG.zh.md 头部纪律)
              // 锚定 WORKSPACE:本步骤已 cd dist,相对路径永远读不到根目录的 CHANGELOG
              const ver = process.env.VER, ws = process.env.WORKSPACE;
              const extract = (file, v) => {
                if (!fs.existsSync(file)) return null;
                const m = fs.readFileSync(file, 'utf8').replace(/\r\n/g, '\n').match(new RegExp('## \\[' + v + '\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[)'));
                return (m && m[1].trim()) ? m[1].trim() : null;
              };
              const en = extract(ws + '/CHANGELOG.md', ver);
              if (!en) { console.error('CHANGELOG has no section for ' + ver); process.exit(1); }
              const zh = extract(ws + '/CHANGELOG.zh.md', ver);
              const body = zh ? (zh + '\n\n---\n\n' + en) : en;
              console.log(zh ? 'bilingual notes: zh + en' : 'WARNING: no zh section in CHANGELOG.zh.md — publishing en only');
              fs.writeFileSync(process.env.RUNNER_TEMP + '/notes.md', body);
          NODEEOF
            gh release edit "$GITHUB_REF_NAME" --draft --notes-file "$RUNNER_TEMP/notes.md"
            BODY_LEN=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '[.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | select(.draft)][0].body // "" | length')
            echo "draft body auto-filled from CHANGELOG, length: $BODY_LEN"
          fi
          if [ "${BODY_LEN:-0}" -lt 30 ]; then
            echo "draft release body still empty/short after auto-fill — CHANGELOG section missing or too short"
            exit 1
          fi

  # Linux support (2026-09-11): AppImage (x64+arm64) + deb (arm64, LubanCat/Rockchip board).
  # Runs AFTER the windows job on purpose: the windows job owns the release gates (check:all) and the
  # idempotent stale-draft cleanup — a parallel linux job would race that cleanup and could delete the
  # draft the windows job just created. Gates are tag-scoped, so they are enforced exactly once, and
  # this job only builds and attaches artifacts to the existing draft.
  release-linux:
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pickdone/package-lock.json

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pickdone/package-lock.json') }}

      - name: Verify tag matches package.json version
        run: |
          V=$(node -p "require('./pickdone/package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json version v$V"; exit 1
          fi

      - name: Install
        working-directory: pickdone
        run: npm ci

      - name: Build packaging whitelist (parity with ci.yml / windows release job)
        working-directory: pickdone
        run: |
          node scripts/build-whitelist.mjs
          git diff --exit-code package.json || (echo '::error::build.files drifted from the lock closure (hand-edited without build-whitelist)' && exit 1)

      # Cross-arch from x64 runner is safe: electron arm64 binaries are downloaded prebuilt and the
      # sqlite vendor driver ships linux-arm64/linux-x64 .node prebuilds — nothing compiles from source.
      # renderer bundle is a gitignored build artifact: the windows job produces it inside check:all,
      # this job runs standalone afterwards, so it must build explicitly before packaging
      # (2026-09-11 board incident: packaging without it shipped a "not found" white window)
      - name: Build renderer bundle
        working-directory: pickdone
        run: npm run build:renderer

      - name: Build & publish (draft)
        working-directory: pickdone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --arm64 --x64 --publish always && npx electron-builder --linux deb --arm64 --publish always

      - name: Verify packaged artifacts (renderer + smoke trio, parity with the manual test workflow)
        working-directory: pickdone
        run: |
          # electron-builder names the x64 unpacked dir WITHOUT an arch suffix (linux-unpacked)
          for PAIR in "arm64 linux-arm64-unpacked" "x64 linux-unpacked"; do
            set -- $PAIR; ARCH=$1; DIR=$2
            npx --yes @electron/asar list dist/$DIR/resources/app.asar | grep -q "renderer-dist/index.html" || { echo "::error::renderer-dist/index.html missing from $ARCH asar"; exit 1; }
            test -f dist/$DIR/resources/vendor/better-sqlite3-multiple-ciphers/prebuilds/linux-$ARCH.node || { echo "::error::linux-$ARCH sqlite prebuild missing ($ARCH package)"; exit 1; }
            test -f dist/$DIR/resources/bin/pickdone || { echo "::error::cli unix shim missing ($ARCH package)"; exit 1; }
            test -x dist/$DIR/resources/bin/pickdone || { echo "::error::cli unix shim not executable ($ARCH package)"; exit 1; }
            test -f dist/$DIR/resources/cli/pickdone.js || { echo "::error::bundled cli missing ($ARCH package)"; exit 1; }
          done

      # Live boot parity with the windows job: the exe-instant-exit class (missing renderer entry,
      # driver load failure) is invisible to static checks. xvfb gives the app a display; the boot is
      # proven by main.log reaching app-ready.
      - name: Live-boot packaged arm64 app (xvfb)
        working-directory: pickdone
        env:
          TODO_USER_DATA_DIR: /tmp/boot-ud
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          rm -rf /tmp/boot-ud
          xvfb-run -a ./dist/linux-arm64-unpacked/pickdone --no-sandbox > /tmp/boot-stdout.log 2>&1 &
          BOOT_PID=$!
          sleep 25
          if ! kill -0 $BOOT_PID 2>/dev/null; then echo "::error::packaged app exited immediately"; tail -20 /tmp/boot-stdout.log; exit 1; fi
          LOG=$(find /tmp/boot-ud -name main.log | head -1)
          if [ -z "$LOG" ]; then echo "::error::no main.log written — app never reached ready"; tail -20 /tmp/boot-stdout.log; exit 1; fi
          grep -q "数据库初始化完成" "$LOG" || { echo "::error::DB init never completed"; grep -E "error|初始化" "$LOG" | tail -5; exit 1; }
          echo "boot OK (arm64, DB initialized)"
          kill $BOOT_PID 2>/dev/null || true

      - name: Linux SHA256 checksums & attach
        working-directory: pickdone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum *.AppImage *.deb latest-linux.yml latest-linux-arm64.yml > SHA256SUMS-linux.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS-linux.txt --clobber
