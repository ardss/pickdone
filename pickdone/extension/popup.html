<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>PickDone queue</h1>
  <div class="row">
    <label for="endpoint">Endpoint</label>
    <input id="endpoint" type="text" spellcheck="false" placeholder="http://127.0.0.1:7789/capture" />
  </div>
  <div class="row">
    <label for="apiKey">Access key</label>
    <input id="apiKey" type="password" placeholder="paste key from PickDone settings" />
  </div>
  <div id="summary">…</div>
  <ul id="entries"></ul>
  <button id="flush">Send queued items now</button>
  <script src="popup.js"></script>
</body>
</html>
